dependencies:
  idf: ">=5.3"
  # TensorFlow Lite Micro runtime — runs the microWakeWord streaming model. The component
  # manager fetches it into managed_components/ and auto-adds it to this component's requires.
  espressif/esp-tflite-micro: "^1.3.3"
  # Audio frontend (log-mel filterbank feature generator) the streaming model was trained
  # against. Not in the component registry — pulled directly from its source repo.
  ESPMicroSpeechFeatures:
    git: https://github.com/0xD34D/ESPMicroSpeechFeatures.git
